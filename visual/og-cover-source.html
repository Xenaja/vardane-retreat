<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1200px; height:630px; display:grid; grid-template-columns:1fr 440px;
         background:#FDF6EF; color:#403A34; font-family:'Golos Text',system-ui,sans-serif; overflow:hidden; }
  .txt { padding:64px 48px 56px 72px; display:flex; flex-direction:column; justify-content:center; }
  .eb { font-size:17px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:#A6534A; margin-bottom:26px; }
  h1 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:500; font-size:78px; line-height:1.04; letter-spacing:.02em; text-transform:uppercase; color:#A62F55; }
  h1 em { display:block; font-style:normal; color:#C4685E; }
  .sub { margin-top:30px; font-size:24px; line-height:1.35; color:#3C5A55; font-family:'Cormorant Garamond',Georgia,serif; }
  .rail { margin-top:34px; padding-top:20px; border-top:1px solid rgba(21,71,68,.18);
          display:flex; gap:14px; align-items:baseline; font-size:19px; color:#154744; }
  .rail b { font-weight:500; }
  .rail span { color:#5F574F; }
  .ph { position:relative; overflow:hidden; }
  .ph img { width:100%; height:100%; object-fit:cover; object-position:50% 18%; }
</style>
</head>
<body>
  <div class="txt">
    <p class="eb">Вардане · Сочи · 9—12 октября 2026</p>
    <h1>Йога и <em>процветание</em></h1>
    <p class="sub">Женский ретрит по Кундалини йоге<br>с Атма Бани Каур</p>
    <p class="rail"><b>40 000 ₽</b><span>всё включено · 4 дня у моря</span></p>
  </div>
  <div class="ph"><img src="../photos/r/portrait-white.webp" alt=""></div>
</body>
</html>
